<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标题方案 v2 预览</title>
<style>
  :root{--ink:#2c2436;--muted:#6b6178}
  *{box-sizing:border-box}
  body{margin:0;padding:26px 22px 60px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 18% -10%,#ffeef7 0%,#f6f0ff 42%,#eef4ff 100%);min-height:100vh}
  h1.page{font-size:20px;margin:0 0 6px}
  p.lead{margin:0 0 22px;color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1040px}
  .opt{background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);border-radius:20px;padding:24px 20px;position:relative;
    box-shadow:0 12px 30px rgba(120,90,160,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:190px;overflow:hidden}
  .cap{position:absolute;top:12px;left:14px;font-size:12px;color:#8b7fa0}
  .cap b{color:#e05b95}
  .demo{font-size:clamp(26px,3.2vw,40px);font-weight:900;letter-spacing:.02em;display:flex;align-items:center;gap:.14em;flex-wrap:wrap;justify-content:center;text-align:center;line-height:1.2}
  @media (max-width:820px){ .grid{grid-template-columns:1fr} }

  /* 1 柔光细描边 */
  .o1 .w{color:#fff;-webkit-text-stroke:2px rgba(255,160,205,.95);paint-order:stroke fill;
    text-shadow:0 2px 0 rgba(255,140,190,.55),0 6px 18px rgba(255,120,180,.42);transform:rotate(-1.2deg)}
  .o1 .w .soft{background:linear-gradient(180deg,#fff 0%,#ffe6f3 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  /* 2 双色分栏 */
  .o2 .w{display:flex;align-items:baseline;gap:.1em}
  .o2 .a{background:linear-gradient(100deg,#ff4f97,#ff86bf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 8px rgba(255,110,175,.35))}
  .o2 .b{background:linear-gradient(100deg,#8b7bff,#b79bff 60%,#7fa3ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 8px rgba(140,110,255,.35))}

  /* 3 奶油立体 */
  .o3 .w{background:linear-gradient(180deg,#fffdf8 0%,#ffe9d6 55%,#ffd3b8 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    -webkit-text-stroke:1px rgba(120,78,60,.55);paint-order:stroke fill;
    text-shadow:0 1px 0 #fff,0 4px 0 rgba(214,160,132,.55),0 9px 16px rgba(190,130,110,.28)}

  /* 4 玻璃高光 */
  .o4 .w{background:linear-gradient(180deg,rgba(255,255,255,.98) 0%,rgba(255,214,236,.72) 52%,rgba(214,206,255,.62) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 8px 16px rgba(150,120,210,.22))}

  .note{max-width:1040px;margin:22px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
  <h1 class="page">🎀 标题方案 v2（更克制的一组）</h1>
  <p class="lead">上一版太花的话，这组都降低了饱和度、去掉了大幅动画；选定后再应用到首页（现在首页已还原成原版标题）。</p>
  <div class="grid">
    <section class="opt o1"><div class="cap"><b>方案 1</b> · 柔光细描边</div>
      <div class="demo"><span class="w soft">🎧 日音成分匹配器</span></div></section>

    <section class="opt o2"><div class="cap"><b>方案 2</b> · 双色分栏</div>
      <div class="demo"><span class="w"><span class="a">日音</span><span class="b">成分匹配器</span></span></div></section>

    <section class="opt o3"><div class="cap"><b>方案 3</b> · 奶油立体</div>
      <div class="demo"><span class="w">🎧 日音成分匹配器</span></div></section>

    <section class="opt o4"><div class="cap"><b>方案 4</b> · 玻璃高光</div>
      <div class="demo"><span class="w">🎧 日音成分匹配器</span></div></section>
  </div>
  <p class="note">也可以混搭：方案 2 的配色 + 方案 1 的细描边；方案 3 的立体阴影 + 方案 4 的玻璃质感。</p>
</body>
</html>
