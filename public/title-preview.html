<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标题艺术字方案预览</title>
<style>
  :root{--ink:#2c2436;--muted:#6b6178;}
  *{box-sizing:border-box}
  body{margin:0;padding:26px 22px 60px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 20% -10%,#ffeaf5 0%,#f7f0ff 40%,#eef3ff 100%);min-height:100vh}
  h1.page{font-size:20px;margin:0 0 6px}
  p.lead{margin:0 0 22px;color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1040px}
  .opt{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:22px 20px 18px;
    box-shadow:0 12px 30px rgba(120,90,160,.13);display:flex;flex-direction:column;align-items:center;gap:10px;min-height:220px;justify-content:center;position:relative;overflow:hidden}
  .cap{position:absolute;top:12px;left:14px;font-size:12px;color:#8b7fa0;letter-spacing:.5px}
  .cap b{color:#e05b95}
  .demo{font-size:clamp(24px,3.1vw,38px);line-height:1.25;display:flex;align-items:center;justify-content:center;gap:.16em;flex-wrap:wrap;text-align:center}
  @media (max-width:820px){ .grid{grid-template-columns:1fr} }

  /* A 糖果泡泡 */
  .optA .demo{font-family:"Yuanti SC","YouYuan","Microsoft YaHei",sans-serif;font-weight:900;letter-spacing:.04em}
  .optA .w{background:linear-gradient(180deg,#ffffff 0%,#ffd9ec 36%,#ff92c8 68%,#ff6ab0 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 rgba(255,255,255,.95)) drop-shadow(0 9px 16px rgba(255,110,175,.45))}
  .optA .w span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .optA .w span:nth-child(2n){animation-delay:.18s}
  .optA .w span:nth-child(3n){animation-delay:.34s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .optA .dots i{position:absolute;border-radius:50%;opacity:.85;filter:blur(.2px)}
  .optA .dots i:nth-child(1){width:12px;height:12px;background:#ffd166;left:16%;top:26%}
  .optA .dots i:nth-child(2){width:8px;height:8px;background:#8fd3ff;right:18%;top:24%}
  .optA .dots i:nth-child(3){width:9px;height:9px;background:#ff9ecb;right:26%;bottom:24%}
  .optA .dots i:nth-child(4){width:7px;height:7px;background:#b7e7a8;left:24%;bottom:26%}

  /* B 手绘贴纸 */
  .optB .demo{transform:rotate(-2deg)}
  .optB .w{font-weight:900;color:#fff;-webkit-text-stroke:8px #2f2440;paint-order:stroke fill;
    text-shadow:5px 5px 0 #ffd166,10px 10px 0 rgba(47,36,64,.16);letter-spacing:.03em}
  .optB .w span{display:inline-block}
  .optB .w span:nth-child(1){transform:rotate(-5deg)}
  .optB .w span:nth-child(2){transform:rotate(3deg) translateY(2px)}
  .optB .w span:nth-child(3){transform:rotate(-2deg) translateY(-2px)}
  .optB .w span:nth-child(4){transform:rotate(4deg)}
  .optB .w span:nth-child(5){transform:rotate(-3deg) translateY(2px)}
  .optB .tag{position:absolute;right:14px;bottom:12px;font-size:20px}

  /* C 霓虹果冻 */
  .optC .demo{font-weight:900;letter-spacing:.05em;animation:jelly 2.8s ease-in-out infinite}
  .optC .w{background:linear-gradient(180deg,#fff3fb 0%,#ffc0e2 38%,#ff6cb4 60%,#ffd0ea 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 6px rgba(255,120,195,.6)) drop-shadow(0 0 20px rgba(255,120,195,.35))}
  @keyframes jelly{0%,100%{transform:scale(1)}50%{transform:scale(1.035,1.02)}}
  .optC .glow{position:absolute;width:180px;height:60px;left:50%;bottom:16px;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,rgba(255,120,195,.45),rgba(255,120,195,0) 70%);filter:blur(6px)}

  /* D Q版徽章 + 错落 */
  .optD .demo{gap:.2em}
  .optD .badge{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;
    background:radial-gradient(circle at 34% 28%,#fff 0%,#ffd6ea 42%,#ff8cc5 100%);
    box-shadow:0 0 0 4px #fff,0 0 0 7px rgba(255,170,205,.5),0 10px 20px rgba(255,110,170,.35);
    transform:rotate(-6deg)}
  .optD .w{font-family:"Yuanti SC","YouYuan","Microsoft YaHei",sans-serif;font-weight:900;
    background:linear-gradient(100deg,#ff5f9e,#ff9ad0 40%,#9d8bff 75%,#5fc7ff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    letter-spacing:.02em}
  .optD .w span{display:inline-block}
  .optD .w span:nth-child(odd){transform:rotate(-4deg) translateY(2px)}
  .optD .w span:nth-child(even){transform:rotate(4deg) translateY(-2px)}
  .optD .spark{position:absolute;font-size:16px;opacity:.9}
  .optD .spark.s1{left:14%;top:22%}
  .optD .spark.s2{right:13%;top:26%}
  .optD .spark.s3{right:22%;bottom:22%}
  .optD .spark.s4{left:22%;bottom:24%}
  .note{max-width:1040px;margin:22px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
  <h1 class="page">🎀 标题艺术字方案预览</h1>
  <p class="lead">四套都只用了 CSS，不依赖额外字体文件；实际落地时会嵌进站点首页标题位置。</p>
  <div class="grid">

    <section class="opt optA">
      <div class="cap"><b>方案 A</b> · 糖果泡泡</div>
      <div class="dots"><i></i><i></i><i></i><i></i></div>
      <div class="demo"><span class="w"><span>日</span><span>音</span><span>成</span><span>分</span><span>匹</span><span>配</span><span>器</span></span></div>
    </section>

    <section class="opt optB">
      <div class="cap"><b>方案 B</b> · 手绘贴纸</div>
      <div class="demo"><span class="w"><span>日</span><span>音</span><span>成</span><span>分</span><span>匹</span><span>配</span><span>器</span></span></div>
      <span class="tag">🎵</span>
    </section>

    <section class="opt optC">
      <div class="cap"><b>方案 C</b> · 霓虹果冻</div>
      <div class="demo"><span class="w">日音成分匹配器</span></div>
      <div class="glow"></div>
    </section>

    <section class="opt optD">
      <div class="cap"><b>方案 D</b> · Q 版徽章</div>
      <div class="demo"><span class="badge">🎧</span><span class="w"><span>日</span><span>音</span><span>成</span><span>分</span><span>匹</span><span>配</span><span>器</span></span></div>
      <span class="spark s1">✨</span><span class="spark s2">🎵</span><span class="spark s3">💗</span><span class="spark s4">✨</span>
    </section>

  </div>
  <p class="note">也可以混搭，例如「A 的糖果渐变 + D 的 Q 版徽章」「B 的贴纸描边 + C 的呼吸光晕」。</p>
</body>
</html>
