<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标题方案 v3 · City Pop</title>
<style>
  :root{--ink:#f4ecff}
  *{box-sizing:border-box}
  body{margin:0;padding:26px 22px 60px;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#3b2f4a;
    background:radial-gradient(1200px 700px at 20% -10%,#ffe6ef 0%,#f0e6ff 40%,#e6efff 100%);min-height:100vh}
  h1.page{font-size:20px;margin:0 0 6px}
  p.lead{margin:0 0 22px;color:#6b6178;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1060px}
  .opt{border-radius:20px;padding:26px 18px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:210px;overflow:hidden;
    background:linear-gradient(160deg,#2b1f45 0%,#432a5e 48%,#5a2a63 100%);box-shadow:0 14px 34px rgba(60,30,90,.35);border:1px solid rgba(255,255,255,.14)}
  .cap{position:absolute;top:12px;left:14px;font-size:12px;color:#cbb9e6;letter-spacing:.4px}
  .cap b{color:#ff8fc4}
  .demo{font-size:clamp(26px,3.2vw,40px);font-weight:900;line-height:1.2;letter-spacing:.02em;display:flex;align-items:center;gap:.1em;flex-wrap:wrap;justify-content:center;text-align:center;
    font-style:italic;transform:skewX(-8deg)}
  @media (max-width:820px){ .grid{grid-template-columns:1fr} }

  /* A 日落铬光 */
  .oA .w{background:linear-gradient(180deg,#fff6d5 0%,#ffd36e 16%,#ff9a5f 36%,#ff5fa2 58%,#b072ff 78%,#5b8cff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    -webkit-text-stroke:1px rgba(70,30,80,.55);paint-order:stroke fill;
    filter:drop-shadow(0 0 12px rgba(255,120,190,.65)) drop-shadow(0 0 26px rgba(140,110,255,.5))}

  /* B 镀铬金属 */
  .oB .w{background:linear-gradient(180deg,#ffffff 0%,#eaf1ff 18%,#aab9dd 34%,#ff9ecb 50%,#ffe0f1 60%,#8894ff 80%,#eef5ff 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    -webkit-text-stroke:1.6px #241a38;paint-order:stroke fill;
    text-shadow:3px 3px 0 #ff3d8b,7px 7px 0 rgba(50,30,90,.55)}

  /* C 霓虹灯管 */
  .oC .w{color:transparent;-webkit-text-stroke:3px #ff59ac;paint-order:stroke fill;
    filter:drop-shadow(0 0 6px rgba(255,90,180,.95)) drop-shadow(0 0 18px rgba(255,90,180,.6)) drop-shadow(0 0 34px rgba(120,140,255,.45));
    animation:neonFlicker 6s ease-in-out infinite}
  @keyframes neonFlicker{0%,100%{opacity:1}47%{opacity:.94}52%{opacity:1}86%{opacity:.96}}

  /* D 落日圆盘 */
  .oD{background:linear-gradient(180deg,#241a3c 0%,#3d2154 40%,#7a2f6a 72%,#c04a6f 100%)}
  .oD .sun{position:absolute;width:230px;height:230px;border-radius:50%;left:50%;top:54%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 40%,#ffe9a8 0%,#ffb36b 34%,#ff6f9c 62%,rgba(255,111,156,0) 72%);
    filter:blur(.5px);opacity:.9}
  .oD .sun::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:repeating-linear-gradient(180deg,rgba(36,26,60,.55) 0 3px,transparent 3px 9px)}
  .oD .gridlines{position:absolute;left:-20%;right:-20%;bottom:-10%;height:44%;
    background:
      repeating-linear-gradient(90deg,rgba(255,150,210,.5) 0 1px,transparent 1px 26px),
      repeating-linear-gradient(180deg,rgba(255,150,210,.38) 0 1px,transparent 1px 20px);
    transform:perspective(240px) rotateX(58deg);transform-origin:50% 100%;opacity:.75}
  .oD .w{position:relative;color:#fff;-webkit-text-stroke:1.2px rgba(120,40,110,.6);paint-order:stroke fill;
    text-shadow:0 0 10px rgba(255,140,200,.9),0 0 26px rgba(255,110,180,.6),0 3px 0 rgba(120,40,110,.55)}
  .oD .w .acc{background:linear-gradient(180deg,#fff0a8,#ff9a6b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  .note{max-width:1060px;margin:22px 0 0;font-size:13px;color:#6b6178;line-height:1.7}
</style>
</head>
<body>
  <h1 class="page">🌅 标题方案 v3 · City Pop 迷幻</h1>
  <p class="lead">深底卡片模拟夜间/封面观感；选定后应用到首页标题（首页现在仍是原版）。</p>
  <div class="grid">
    <section class="opt oA"><div class="cap"><b>A</b> · 日落铬光</div>
      <div class="demo"><span class="w">🎧 日音成分匹配器</span></div></section>

    <section class="opt oB"><div class="cap"><b>B</b> · 镀铬金属</div>
      <div class="demo"><span class="w">日音成分匹配器</span></div></section>

    <section class="opt oC"><div class="cap"><b>C</b> · 霓虹灯管</div>
      <div class="demo"><span class="w">日音成分匹配器</span></div></section>

    <section class="opt oD"><div class="cap"><b>D</b> · 落日圆盘</div>
      <span class="sun"></span><span class="gridlines"></span>
      <div class="demo"><span class="w"><span class="acc">日音</span>成分匹配器</span></div></section>
  </div>
  <p class="note">混搭建议：B 的镀铬字 + D 的落日圆盘与网格；C 的灯管 + A 的暖色光晕。</p>
</body>
</html>
